name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FaqBot.slnx
      - run: dotnet build FaqBot.slnx --no-restore -c Release
      - run: dotnet test FaqBot.slnx --no-restore --no-build -c Release
      - run: dotnet run --project tools/FaqBot.Evaluator -c Release --no-restore --no-build -- --min-accuracy 0.8
